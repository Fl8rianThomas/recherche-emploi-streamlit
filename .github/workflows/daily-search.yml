name: Recherche automatique (toutes les 4 h)

# Toutes les 4 heures : 00,04,08,12,16,20 UTC = 6 runs/jour.
# En heure de Paris (été, CEST) : 02h, 06h, 10h, 14h, 18h, 22h.
# Quota : ~28 appels Adzuna/run × 6 ≈ 168/jour, sous la limite gratuite Adzuna
# de 250/jour (à 200 offres/variante/source). FT (4 req/s) et Jooble suivent.
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:        # bouton « Run workflow » pour tester à la demande

jobs:
  recherche:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Lancer la recherche et envoyer l'e-mail
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python daily_search.py
