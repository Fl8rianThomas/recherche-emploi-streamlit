name: Recherche quotidienne (e-mail 20h Paris)

# ~20h heure de Paris TOUTE L'ANNÉE. Le cron GitHub est en UTC (ignore l'heure
# d'été) ET souvent retardé, surtout à xx:00. On planifie donc en HEURE CREUSE
# (17:55 et 18:55 UTC, pas xx:00) et le script (garde-fou CHECK_20H) n'envoie que
# dans la fenêtre 19h55→20h45 Paris — un seul cron y tombe par saison :
#   - été  (CEST) : 17:55 UTC = 19h55 → envoie ; 18:55 UTC = 20h55 → ignoré
#   - hiver (CET)  : 17:55 UTC = 18h55 → ignoré ; 18:55 UTC = 19h55 → envoie
# La borne haute (20h45) garantit qu'un gros retard GitHub ne dérive jamais à 21h.
on:
  schedule:
    - cron: "55 17 * * *"
    - cron: "55 18 * * *"
  workflow_dispatch:        # bouton « Run workflow » pour tester à la demande (envoi immédiat)

jobs:
  recherche:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Lancer la recherche et envoyer l'e-mail
        env:
          # Garde-fou 20h Paris uniquement pour les runs planifiés ; un déclenchement
          # manuel (workflow_dispatch) envoie tout de suite, sans contrôle d'heure.
          CHECK_20H: ${{ github.event_name == 'schedule' && '1' || '' }}
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python daily_search.py
