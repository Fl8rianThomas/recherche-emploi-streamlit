name: Recherche quotidienne (e-mail 20h)

# Une fois par jour à 18:00 UTC = 20h heure de Paris (été, CEST).
# ⚠️ En hiver (CET, UTC+1) cela tombe à 19h Paris. Pour 20h pile toute l'année,
# il faudrait deux crons (18:00 et 19:00 UTC) + un garde-fou dans le script.
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:        # bouton « Run workflow » pour tester à la demande

jobs:
  recherche:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Lancer la recherche et envoyer l'e-mail
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python daily_search.py
