name: Recherche quotidienne (e-mail 20h Paris)

# 20h heure de Paris TOUTE L'ANNÉE. Le cron GitHub est en UTC et ignore l'heure
# d'été, donc on déclenche aux DEUX heures possibles (18:00 et 19:00 UTC) et le
# script (garde-fou CHECK_20H) n'envoie que sur le créneau réellement à 20h Paris :
#   - été  (CEST) : 18:00 UTC = 20h → envoie ; 19:00 UTC = 21h → ignoré
#   - hiver (CET)  : 18:00 UTC = 19h → ignoré ; 19:00 UTC = 20h → envoie
on:
  schedule:
    - cron: "0 18 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:        # bouton « Run workflow » pour tester à la demande (envoi immédiat)

jobs:
  recherche:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Lancer la recherche et envoyer l'e-mail
        env:
          # Garde-fou 20h Paris uniquement pour les runs planifiés ; un déclenchement
          # manuel (workflow_dispatch) envoie tout de suite, sans contrôle d'heure.
          CHECK_20H: ${{ github.event_name == 'schedule' && '1' || '' }}
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python daily_search.py
