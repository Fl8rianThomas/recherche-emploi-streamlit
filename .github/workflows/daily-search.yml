name: Recherche quotidienne (e-mail 20h Paris)

# ~20h heure de Paris TOUTE L'ANNÉE, robuste aux runs GitHub retardés/abandonnés.
# Les runs planifiés GitHub arrivent souvent avec 1-2 h de retard : un créneau
# strict « == 20h » les rejetait tous. On déclenche donc toutes les 30 min de 18h
# à 21h30 UTC, et le script accepte une FENÊTRE LARGE 20h→22h Paris ; un VERROU
# « déjà envoyé aujourd'hui » (branche `mail-state`) garantit un seul e-mail/jour.
# Tentatives réellement dans la fenêtre (été comme hiver) : 20h00/20h30/…/22h30
# Paris -> 6 chances ; les autres (19h, 23h) sont ignorées tout de suite.
on:
  schedule:
    - cron: "0,30 18-21 * * *"
  workflow_dispatch:        # bouton « Run workflow » pour tester à la demande (envoi immédiat)

permissions:
  contents: write           # le verrou anti-doublon écrit mail_lock.json sur `data`

jobs:
  recherche:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Lancer la recherche et envoyer l'e-mail
        env:
          # Garde-fou 20h Paris uniquement pour les runs planifiés ; un déclenchement
          # manuel (workflow_dispatch) envoie tout de suite, sans contrôle d'heure.
          CHECK_20H: ${{ github.event_name == 'schedule' && '1' || '' }}
          # Jeton intégré du workflow : sert au verrou anti-doublon (lecture/écriture
          # de mail_lock.json sur la branche `data`). Aucun secret à configurer.
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python daily_search.py
