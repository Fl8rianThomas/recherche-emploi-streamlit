name: Recherche quotidienne (e-mail 20h Paris)

# ~20h heure de Paris TOUTE L'ANNÉE, robuste aux runs GitHub retardés/abandonnés.
# Le cron GitHub est en UTC (ignore l'heure d'été) ET peu fiable : on déclenche
# donc PLUSIEURS fois (toutes les 20 min sur 18h et 19h UTC) et le script n'envoie
# que si l'heure de Paris == 20h. Un VERROU « déjà envoyé aujourd'hui » (fichier
# sur la branche `data`) garantit qu'un seul e-mail part, même si plusieurs runs
# aboutissent. Créneaux réellement à 20h Paris (les autres sont ignorés vite) :
#   - été  (CEST, UTC+2) : 18:00/18:20/18:40 UTC = 20h00/20h20/20h40 → 3 tentatives
#   - hiver (CET, UTC+1)  : 19:00/19:20/19:40 UTC = 20h00/20h20/20h40 → 3 tentatives
on:
  schedule:
    - cron: "0,20,40 18 * * *"
    - cron: "0,20,40 19 * * *"
  workflow_dispatch:        # bouton « Run workflow » pour tester à la demande (envoi immédiat)

permissions:
  contents: write           # le verrou anti-doublon écrit mail_lock.json sur `data`

jobs:
  recherche:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Lancer la recherche et envoyer l'e-mail
        env:
          # Garde-fou 20h Paris uniquement pour les runs planifiés ; un déclenchement
          # manuel (workflow_dispatch) envoie tout de suite, sans contrôle d'heure.
          CHECK_20H: ${{ github.event_name == 'schedule' && '1' || '' }}
          # Jeton intégré du workflow : sert au verrou anti-doublon (lecture/écriture
          # de mail_lock.json sur la branche `data`). Aucun secret à configurer.
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python daily_search.py
